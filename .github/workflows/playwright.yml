name: playwright

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  playwright-gate:
    name: Playwright Preview Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Preview Test
        run: npx playwright test playwright/preview.spec.ts
