# Playwright E2E Integration Gate.
# Gated Specs:
#   - ui/playwright/preview.spec.ts: Gated because it uses purely fixture-driven
#     components on mock-only preview routes, requiring no active backend server.
#
# Excluded Specs:
#   - ui/playwright/run-detail.spec.ts: Excluded because it performs full page loads
#     on dynamic routes (/run/*) that require a live FastAPI backend to resolve API requests.
#   - ui/playwright/visual-qa.spec.ts: Excluded because it performs visual regression testing
#     which requires baseline screenshot comparisons managed interactively by humans.
name: playwright

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  playwright-gate:
    name: Playwright Preview Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Preview Test
        # Run only the frontend-only preview.spec.ts.
        # Other specs like run-detail.spec.ts require an active backend service.
        run: npx playwright test playwright/preview.spec.ts

