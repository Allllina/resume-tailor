name: contracts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contract-drift-gate:
    name: Contract Drift Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "jsonschema>=4.23"

      - name: Run contract drift-gate checks
        run: python3 scripts/check_contracts.py
