[project]
name = "harness"
version = "0.4.0"
description = "Harness layer for jobsearch-ops-agent — Wave 1 Tier 1 PoC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "anthropic>=0.39",
    "openai>=1.55",
    "jsonschema>=4.23",
    "tenacity>=9.0",
    "aiosqlite>=0.20",
    "loguru>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.14.3",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.11.2",
    "selenium>=4.25",
    "selenium-stealth>=1.0.6",
    "python-jobspy>=1.1.80",
    "pyyaml>=6.0",
    "pyperclip>=1.9",
    "aiosmtplib>=3.0",
    "sse-starlette>=2.1",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "webdriver-manager>=4.0",
]
# Pass 3 / D.4 verifier subagent dependencies. Opt-in via
# `pip install -e .[verifier]`. Kept optional so the Tier 1 PoC and tests
# don't pay the install cost until the LangGraph claim-verifier lands.
verifier = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
